# Tests the publishing secrets check that the Maven Central publish workflows of kite-api, kite-proto
# and kite-provider-sdk run first (.github/actions/check-publish-secrets, kitecorp/kite-provider-sdk#11).
#
# On a push that changes the check, it runs the check's tests against throwaway keys. Started by hand
# on main, it also runs the check against this repository's real secrets, which tells whether a
# release would get past them without building or publishing anything.

name: Check publishing secrets

on:
  push:
    paths:
      - '.github/actions/check-publish-secrets/**'
      - '.github/workflows/check-publish-secrets.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test the secrets check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same Java the action sets up for the check
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run the tests
        run: bash .github/actions/check-publish-secrets/check.test.sh

  real-secrets:
    name: Check this repository's publishing secrets
    needs: test
    # Only by hand and only on main, like a release: runs on other branches never see the private key
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the publishing secrets
        uses: ./.github/actions/check-publish-secrets
        with:
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-password: ${{ secrets.MAVEN_PASSWORD }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
